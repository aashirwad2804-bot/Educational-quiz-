<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduPrep - Competitive Exam Practice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <h1>🎓 EduPrep</h1>
        <p>Competitive Exam Preparation</p>
    </header>


    <!-- HOME -->
    <section id="home-screen">

        <h2>Choose Your Exam</h2>

        <div class="exam-grid">

            <button onclick="openExam('neet')">
                🩺
                <strong>NEET</strong>
                <small>Medical Entrance</small>
            </button>

            <button onclick="openExam('jee')">
                📐
                <strong>JEE</strong>
                <small>Engineering Entrance</small>
            </button>

            <button onclick="openExam('boards')">
                🏫
                <strong>Boards</strong>
                <small>CBSE & State Boards</small>
            </button>

            <button onclick="openExam('cuet')">
                🎓
                <strong>CUET</strong>
                <small>University Entrance</small>
            </button>

            <button onclick="openExam('nda')">
                🪖
                <strong>NDA</strong>
                <small>Defence Entrance</small>
            </button>

            <button onclick="openExam('ssc')">
                🏛️
                <strong>SSC</strong>
                <small>Government Exams</small>
            </button>

            <button onclick="openExam('banking')">
                🏦
                <strong>Banking</strong>
                <small>Competitive Exams</small>
            </button>

            <button onclick="openExam('railway')">
                🚆
                <strong>Railways</strong>
                <small>Government Exams</small>
            </button>

            <button onclick="openExam('upsc')">
                🇮🇳
                <strong>UPSC</strong>
                <small>Civil Services</small>
            </button>

            <button onclick="openExam('other')">
                🧠
                <strong>Other Exams</strong>
                <small>More Practice</small>
            </button>

        </div>

    </section>


    <!-- SUBJECT SCREEN -->
    <section id="subject-screen" class="hidden">

        <button class="back-btn" onclick="goHome()">
            ← Back
        </button>

        <h2 id="exam-title"></h2>

        <p>Select a subject</p>

        <div id="subject-list"></div>

    </section>


    <!-- CHAPTER SCREEN -->
    <section id="chapter-screen" class="hidden">

        <button class="back-btn" onclick="showSubjects()">
            ← Back
        </button>

        <h2 id="subject-title"></h2>

        <p>Select a chapter</p>

        <div id="chapter-list"></div>

    </section>


    <!-- QUIZ SCREEN -->
    <section id="quiz-screen" class="hidden">

        <div class="quiz-top">

            <span id="quiz-subject"></span>

            <span id="question-number"></span>

        </div>

        <div class="progress-container">

            <div id="progress"></div>

        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="next-btn" onclick="nextQuestion()">
            Next →
        </button>

    </section>


    <!-- RESULT SCREEN -->
    <section id="result-screen" class="hidden">

        <h2>🎉 Test Completed!</h2>

        <div class="result-box">

            <p id="result-exam"></p>

            <p id="result-score"></p>

            <p id="result-percentage"></p>

        </div>

        <button onclick="goHome()">
            <script src="./script.js?v=3"></script>
        </button>

    </section>

</div>


<script src="script.js"></script>

</body>
              </html>
