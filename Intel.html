<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Educational Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 Educational Quiz</h1>

        <p class="subtitle">
            Test your knowledge and improve your preparation.
        </p>

        <div id="start-screen">

            <h2>Mock Test</h2>

            <p>100 Questions</p>

            <button onclick="startQuiz()">
                Start Quiz
            </button>

        </div>

        <div id="quiz-screen" class="hidden">

            <div class="top-bar">

                <span id="question-number">
                    Question 1/100
                </span>

                <span id="timer">
                    30:00
                </span>

            </div>

            <div class="progress-container">
                <div id="progress"></div>
            </div>

            <h2 id="question">
                Question will appear here
            </h2>

            <div id="options"></div>

            <button id="next-btn" onclick="nextQuestion()">
                Next
            </button>

        </div>

        <div id="result-screen" class="hidden">

            <h2>🎉 Test Completed!</h2>

            <p id="score"></p>

            <button onclick="restartQuiz()">
                Restart Quiz
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
